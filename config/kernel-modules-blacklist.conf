# 内核模块黑名单（modprobe.d）
# 即使模块文件存在也禁止加载，作为软兜底保险。
# 与 kernel-modules-remove.list 配合使用。

# 蓝牙
blacklist bluetooth
blacklist btusb
blacklist btrtl
blacklist btintel
blacklist btbcm

# 声卡
blacklist snd
blacklist snd_pcm
blacklist snd_timer
blacklist soundcore

# 显卡（保留 framebuffer 基础显示）
blacklist drm
blacklist drm_kms_helper

# 无线网卡
blacklist cfg80211
blacklist mac80211

# 摄像头/视频采集
blacklist videodev
blacklist videobuf2_common

# 游戏手柄
blacklist joydev
