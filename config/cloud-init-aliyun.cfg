# 阿里云 datasource 优先 + 关键 cloud-init 模块启用
# 写入位置：/etc/cloud/cloud.cfg.d/90-aliyun.cfg

# 优先使用阿里云元数据服务，回退 NoCloud / ConfigDrive
datasource_list: [AliYun, NoCloud, ConfigDrive, None]

datasource:
  AliYun:
    timeout: 5
    max_wait: 10

# 启用关键模块（包含 growpart/resizefs 用于磁盘自动扩容）
cloud_init_modules:
  - migrator
  - seed_random
  - bootcmd
  - write-files
  - growpart
  - resizefs
  - disk_setup
  - mounts
  - set_hostname
  - update_hostname
  - update_etc_hosts
  - ca-certs
  - rsyslog
  - users-groups
  - ssh
