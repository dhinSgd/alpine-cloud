# 阿里云 datasource 优先 + 关键 cloud-init 模块启用
# 写入位置：/etc/cloud/cloud.cfg.d/90-aliyun.cfg

# 优先使用阿里云元数据服务，回退 NoCloud / ConfigDrive
datasource_list: [AliYun, NoCloud, ConfigDrive, None]

datasource:
  AliYun:
    timeout: 5
    max_wait: 10

# SSH 公钥/密码注入策略
# disable_root: false
#   cloud-init 默认 true，会把元数据注入到 root 的公钥前缀加 command="echo Please login as the user ..."
#   导致密钥变废纸。本镜像默认登录用户即 root，必须显式覆盖为 false。
# ssh_pwauth: true
#   保留密码登录通道（兜底 VNC 救援等场景）。
disable_root: false
ssh_pwauth: true

# 明确默认用户为 root：阿里云控制台绑定密钥对时，cloud-init 会注入到此用户的 ~/.ssh/authorized_keys
# 不设置时 cloud-init 可能找 ec2-user/alpine 等不存在的用户而静默失败。
system_info:
  default_user:
    name: root
    lock_passwd: false

# 启用关键模块（包含 growpart/resizefs 用于磁盘自动扩容）
cloud_init_modules:
  - migrator
  - seed_random
  - bootcmd
  - write-files
  - growpart
  - resizefs
  - disk_setup
  - mounts
  - set_hostname
  - update_hostname
  - update_etc_hosts
  - ca-certs
  - rsyslog
  - users-groups
  - ssh
