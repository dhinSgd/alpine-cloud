name: Build Slim Alpine Cloud Image

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/build.yml'

  workflow_dispatch:
    inputs:
      release_tag:
        description: '可选：自定义 Release 标签（不填则自动生成 v<ver>-slim-<ts>）'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.boot_type }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        boot_type: [uefi]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare (install deps + download image)
        run: sudo -E bash scripts/00-prepare.sh --boot ${{ matrix.boot_type }}

      - name: Extract official rootfs
        run: sudo -E bash scripts/01-extract.sh --boot ${{ matrix.boot_type }}

      - name: Customize rootfs (slim down)
        run: sudo -E bash scripts/02-customize.sh --boot ${{ matrix.boot_type }}

      - name: Build target image (btrfs)
        run: sudo -E bash scripts/03-build-image.sh --boot ${{ matrix.boot_type }}

      - name: Finalize (qcow2 + sha256)
        run: sudo -E bash scripts/04-finalize.sh --boot ${{ matrix.boot_type }}

      - name: Upload qcow2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: slim-alpine-${{ matrix.boot_type }}
          path: |
            output/slim-alpine-*-${{ matrix.boot_type }}.qcow2
            output/slim-alpine-*-${{ matrix.boot_type }}.qcow2.sha256
          retention-days: 7
          if-no-files-found: error

  test:
    name: Boot Test (${{ matrix.boot_type }})
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        boot_type: [uefi]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install qemu + ovmf + expect
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf expect

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: slim-alpine-${{ matrix.boot_type }}
          path: output/

      - name: Boot test (qemu + expect)
        run: sudo -E bash scripts/05-test-boot.sh --boot ${{ matrix.boot_type }} --timeout 300

  release:
    name: Create GitHub Release
    needs: test
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: output/
          merge-multiple: true

      - name: Show downloaded files
        run: ls -lh output/

      - name: Generate combined SHA256SUMS
        working-directory: output
        run: |
          rm -f SHA256SUMS
          sha256sum *.qcow2 > SHA256SUMS
          cat SHA256SUMS

      - name: Determine release tag
        id: tag
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            ALPINE_VER=$(grep '^ALPINE_VERSION=' config/source.env | cut -d'"' -f2)
            TAG="v${ALPINE_VER}-slim-$(date -u +%Y%m%d-%H%M%S)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Generate release notes
        run: |
          ALPINE_VER=$(grep '^ALPINE_VERSION=' config/source.env | cut -d'"' -f2)
          cat > release_notes.md <<EOF
          # Slim Alpine Cloud Image - ${{ steps.tag.outputs.tag }}

          基于 Alpine Linux \`${ALPINE_VER}\` 官方 cloud 镜像精简构建，针对阿里云 ECS 优化。

          ## 产物

          - \`slim-alpine-${ALPINE_VER}-uefi.qcow2\` — UEFI 启动版本（qcow2 格式）
          - \`SHA256SUMS\` — 校验和

          ## 默认凭据

          > ⚠️ **首次登录后请立即修改密码！**

          - 用户名：\`root\`
          - 密码：\`slimalpine123\`

          ## 特性

          - 根分区：**btrfs + zstd:9 透明压缩**（新写入文件自动压缩）
          - 完整 cloud-init（含 growpart / resizefs，首启自动扩容）
          - 阿里云 datasource 优先
          - 内置工具：\`ping wget curl nano chrony\`
          - 内核精简：删除蓝牙/声卡/显卡/无线/媒体/游戏手柄等无关驱动

          ## 校验

          下载后请用 \`SHA256SUMS\` 验证镜像完整性：

          \`\`\`
          sha256sum -c SHA256SUMS
          \`\`\`

          ## 使用

          见仓库 [docs/USAGE.md](https://github.com/${{ github.repository }}/blob/main/docs/USAGE.md)。
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body_path: release_notes.md
          files: |
            output/*.qcow2
            output/SHA256SUMS
          draft: false
          prerelease: false
